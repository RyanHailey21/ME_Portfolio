    projects:
      - name: Autorotation Recovery Drone (Capstone)
        date: Spring 2026
        highlights:
          - Led aerodynamic optimization (CasADi/IPOPT nonlinear programming) of a 3-blade autorotation system to maximize unpowered descent time for a 3D-printed rotorcraft.
          - Designed a semi-autonomous flight controller (ESP32-S3 + Betaflight) with Kalman-filtered altitude estimation and cascaded velocity control.
          - Automated a CadQuery pipeline to generate parametric blade geometry from optimizer output; design won the competition.

      - name: RoboMasters Combat Robot Competition
        date: Fall 2024 - Summer 2026
        highlights:
          - Co-founded UTA's inaugural RoboMasters team and served as Drivetrain Lead, owning subsystem design intent, coordinating interfaces and schedules across team leads, and mentoring junior members.
          - Designed and manufactured 4 custom drivetrain components using CAD modeling and Bambu 3D printers.
          - Performed modal, stiffness, and strength simulations in ANSYS Workbench on the aluminum chassis to evaluate vibration behavior, deflection, and structural integrity.

      - name: Autonomous UGV Development
        date: Spring 2026
        highlights:
          - Developed a tracked autonomous vehicle progressing from GPS waypoint navigation to encoder-based dead reckoning and LiDAR localization using ROS2/Nav2.
          - Integrated a Teensy 4.1, Intel NUC, motor encoders, and RPLIDAR A2; implemented differential-drive control, PID tuning, and a custom ROS2 serial bridge for motor commands.
          - Designed and iterated drivetrain components and sensor mounts in SolidWorks, resolving mechanical failures through load-path analysis, print-orientation changes, and reinforced hardware.
          - Achieved reliable multi-waypoint navigation using SLAM Toolbox, AMCL localization, and Nav2 path planning and obstacle avoidance.

    education:
