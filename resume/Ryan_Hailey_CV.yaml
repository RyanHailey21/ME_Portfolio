          - Supported life-cycle development of complex electromechanical systems for HIMARS and M270 MLRS platforms, balancing performance, schedule, and stakeholder requirements.
          - Interpreted customer and program requirements to support design decisions and resource prioritization across engineering teams.
          - Coordinated with mechanical, electrical, and manufacturing stakeholders to align system changes with delivery timelines.
          - Analyzed mechanical and electrical system issues to assess operational risk and recommend corrective actions.
          - Developed 3D models and engineering documentation to communicate design intent across teams.

